    <main class="container my-5" style="max-width: 800px">
      <h3 class="fw-bold text-dark mb-4">
        <i class="bi bi-journal-plus text-primary me-2"></i>Tambah Data Buku
      </h3>
      <section class="card border-0 shadow-sm rounded-4 p-3 p-md-4">
        <div class="card-body">
          <form>
            <div class="row g-3">
              <div class="col-md-12">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="judul"
                    placeholder="Judul Buku"
                    required
                  />
                  <label for="judul">Judul Buku</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="pengarang"
                    placeholder="Pengarang"
                    required
                  />
                  <label for="pengarang">Pengarang</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <select class="form-select" id="kategori">
                    <option value="fiksi">Fiksi</option>
                    <option value="non-fiksi">Non-Fiksi</option>
                    <option value="referensi">Referensi</option>
                  </select>
                  <label for="kategori">Kategori</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-floating">
                  <input
                    type="number"
                    class="form-control"
                    id="tahun"
                    placeholder="2024"
                    min="1900"
                    max="2026"
                    required
                  />
                  <label for="tahun">Tahun Terbit</label>
                </div>
              </div>
              <div class="col-md-5">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="isbn"
                    placeholder="ISBN"
                  />
                  <label for="isbn">ISBN</label>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-floating">
                  <input
                    type="number"
                    class="form-control"
                    id="stok"
                    placeholder="Stok"
                    min="0"
                    required
                  />
                  <label for="stok">Jumlah Stok</label>
                </div>
              </div>
            </div>
            <hr class="my-4 text-secondary" />
            <div class="text-end">
              <button type="reset" class="btn btn-light me-2 px-4 rounded-pill">
                Batal
              </button>
              <button
                type="submit"
                class="btn btn-primary px-4 rounded-pill shadow-sm"
              >
                <i class="bi bi-save me-2"></i>Simpan Data
              </button>
            </div>
          </form>
        </div>
